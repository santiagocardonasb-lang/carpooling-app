<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/car.svg" />
    <link rel="apple-touch-icon" href="/car.svg" />
    <meta name="theme-color" content="#FFFFFF" />

    <title>carpool · Comparte el viaje</title>
    <meta name="description" content="Comparte tu ruta con estudiantes de la Universidad de Cundinamarca. Divide el costo, reduce las emisiones." />

    <!--
      El tema se resuelve antes del primer pintado. Si esperara al efecto de
      React, quien usa el tema oscuro vería un destello blanco en cada carga.
      Tiene que ser la misma lógica que readTheme() en ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('carpooling.theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name=theme-color]')
              .setAttribute('content', '#09090B');
          }
        } catch (e) {
          /* navegación privada: se queda en claro */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
